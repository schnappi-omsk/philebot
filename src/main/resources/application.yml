xapi:
  baseUrl: https://xapi.us/api
  apiToken: Bearer ${API_TOKEN}
tg:
  baseUrl: https://api.telegram.org/bot
  apiToken: ${TGAPI_TOKEN}
  botName: Asha E-Bot
  systemCaller: Asha Sharma
  systemArg: Power your dreams
ebot:
  serviceHost: ${SERVICE_HOST}
  limitPerUser: 5
  requestsPerMin: 10.0
clown:
  csvUrl: https://wokedetector.cirnoslab.me/data.csv
psn:
  # NPSSO cookie of the bot PSN account, see CLAUDE.md. Never commit a real value.
  npsso: ${PSN_NPSSO:}
  # PlayStation App OAuth client id used by the community PSN libraries
  clientId: ${PSN_CLIENT_ID:}
  # Base64 of "clientId:clientSecret", sent as a Basic authorization header
  clientBasicAuth: ${PSN_CLIENT_BASIC_AUTH:}
  redirectUri: com.scee.psxandroid.scecompcall://redirect
  scope: psn:mobile.v2.core psn:clientapp
  authUrl: https://ca.account.sony.com/api/authz/v3/oauth
  apiUrl: https://m.np.playstation.com/api
  legacyProfileUrl: https://us-prof.np.community.playstation.net/userProfile/v1/users
  userAgent: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36
  language: en-US
  requestsPerMin: 20.0
  titlesLimit: 50
  limitPerUser: 5
  minTrophyType: bronze
  refreshWarningDays: 7
server:
  servlet:
    context-path: /
spring:
  ai:
    openai:
      api-key: ${OPENAI_KEY}
      chat:
        options:
          model: "gpt-4o"
  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
    username: ${PG_USER}
    password: ${PG_PASS}
  flyway:
    baseline-on-migrate: true
    baseline-version: 11
  jpa:
    hibernate:
      ddl-auto: none
